<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy English: Food & Drinks</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Baloo 2 for a playful, rounded look -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Baloo 2"', 'cursive', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#ff4d4d',
                            orange: '#ff9f1c',
                            yellow: '#ffbf69',
                            blue: '#2ec4b6',
                            green: '#2ecc71',
                            pink: '#ff9ff3',
                            bg: '#fdf3e7', // Light warm background
                        }
                    },
                    boxShadow: {
                        'btn': '0 6px 0 rgba(0, 0, 0, 0.15)',
                        'btn-active': '0 2px 0 rgba(0, 0, 0, 0.15)',
                        'card': '0 8px 15px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>

</head>
<body data-page="listening">
<div id="game-container">
<!-- ================= SCREEN 3: UJI LISTENING ================= -->
    <div id="screen-listening" class="screen active bg-sky-100 p-4">
        <!-- Top Header -->
        <div class="flex justify-between items-center mb-2">
            <button onclick="goToScreen('screen-menu')" class="btn-3d bg-white text-blue-600 font-bold py-1 px-4 border-2 border-blue-200 rounded-full shadow flex items-center gap-2"><i class="fas fa-home"></i> Kembali</button>
            <div class="bg-white px-6 py-1 rounded-full border-4 border-yellow-300 shadow-md text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-headphones text-blue-500"></i> Uji Listening
            </div>
            <div class="bg-white px-4 py-1 rounded-lg border-2 border-gray-200 shadow font-bold text-gray-700 flex flex-col items-center">
                <span class="text-xs text-gray-500">Soal</span>
                <span id="list-q-num">1/10</span>
            </div>
        </div>

        <div class="flex gap-4 flex-grow bg-white border-4 border-orange-800 rounded-2xl p-4 shadow-xl">
            <!-- Sidebar -->
            <div class="w-1/4 petunjuk-panel flex flex-col h-full">
                <div class="bg-pink-500 text-white font-bold rounded-full py-1 text-center mb-4 shadow"><i class="fas fa-lightbulb text-yellow-300 mr-2"></i> Petunjuk</div>
                <div class="petunjuk-step"><div class="step-num">1</div><span>Klik tombol play untuk mendengar kosakata.</span></div>
                <div class="petunjuk-step"><div class="step-num">2</div><span>Pilih gambar yang sesuai dengan suara yang kamu dengar.</span></div>
                <div class="petunjuk-step"><div class="step-num">3</div><span>Klik jawaban.</span></div>
            </div>
            
            <!-- Main Content -->
            <div class="w-3/4 flex flex-col h-full bg-yellow-50 rounded-xl border-2 border-yellow-200 p-4 relative">
                <div class="bg-yellow-200 rounded-full py-1 px-4 mx-auto font-bold text-yellow-800 mb-4 flex items-center gap-2 shadow-sm w-max">
                    <i class="fas fa-bullhorn text-blue-500"></i> Dengarkan dengan baik!
                </div>

                <div class="bg-white rounded-full border-2 border-gray-200 shadow-inner flex items-center p-2 mx-auto w-3/4 mb-6">
                    <button onclick="playListeningAudio()" class="bg-blue-500 text-white w-10 h-10 rounded-full flex justify-center items-center text-xl shadow btn-3d hover:bg-blue-600 flex-shrink-0"><i class="fas fa-play ml-1"></i></button>
                    <div class="w-full h-2 bg-gray-300 rounded-full mx-4 overflow-hidden"><div class="h-full bg-blue-500 w-0" id="list-audio-bar"></div></div>
                </div>

                <div class="grid grid-cols-4 gap-3 flex-grow" id="listening-options">
                    <!-- Options injected by JS -->
                </div>

                <!-- Footer Nav -->
                <div class="flex justify-between items-center mt-4">
                    <div class="invisible">Prev</div>
                    <div class="flex gap-1" id="list-dots">
                        <!-- Dots -->
                    </div>
                    <button onclick="nextListening()" class="bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-btn btn-3d hover:bg-blue-600">Selanjutnya <i class="fas fa-chevron-right ml-1"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Global Modal Feedback (Benar/Salah) -->
<div id="feedback-modal" class="modal-overlay" style="z-index: 999;">
    <div class="modal-content border-white flex flex-col items-center justify-center w-80 text-center" id="feedback-content">
        <div id="fb-icon" class="text-6xl mb-2">🌟</div>
        <h2 id="fb-title" class="text-3xl font-bold mb-2">Good Job!</h2>
        <p id="fb-text" class="text-gray-700 mb-4 font-bold text-lg"></p>
        <button onclick="closeFeedback()" class="bg-blue-500 text-white font-bold py-2 px-8 rounded-full shadow-btn btn-3d">OK</button>
    </div>
</div>
<div id="orientation-warning" role="status" aria-live="polite">
    <i class="fas fa-mobile-screen-button" aria-hidden="true"></i>
    <p>Silakan putar HP ke posisi horizontal (landscape) untuk bermain dalam rasio 16:9.</p>
</div>
<script src="../js/app.js"></script>
</body>
</html>
