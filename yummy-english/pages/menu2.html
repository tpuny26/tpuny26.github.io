        function createCoverTexture(isFront) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1440;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 1024, 1440);
            gradient.addColorStop(0, '#5b3827');
            gradient.addColorStop(1, '#2b170f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1440);
            ctx.strokeStyle = '#e9c66e';
            ctx.lineWidth = 12;
            ctx.strokeRect(54, 54, 916, 1332);
            ctx.strokeStyle = 'rgba(233, 198, 110, 0.55)';
            ctx.lineWidth = 3;
            ctx.strokeRect(78, 78, 868, 1284);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#f7d879';
            ctx.font = 'bold 52px "Baloo 2", sans-serif';
            ctx.fillText(isFront ? "NAFISYA'S RESTAURANT" : 'YUMMY ENGLISH', 512, 310);
            ctx.fillStyle = '#fff8e8';
            ctx.font = 'bold 104px "Baloo 2", sans-serif';
            ctx.fillText(isFront ? 'YUMMY' : 'FOOD', 512, 590);
            ctx.fillText(isFront ? 'ENGLISH' : '& DRINKS', 512, 710);
            ctx.fillStyle = '#f7d879';
            ctx.font = 'bold 48px "Baloo 2", sans-serif';
            ctx.fillText(isFront ? 'FOOD & DRINKS' : 'MENU RESTORAN', 512, 850);
            ctx.fillStyle = '#fff8e8';
            ctx.font = '36px "Baloo 2", sans-serif';
            ctx.fillText(isFront ? 'Balik halaman dan jelajahi menu!' : 'Terima kasih sudah berkunjung!', 512, 1110);
            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = 4;
            return texture;
        }

        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lineY = y;

            words.forEach((word) => {
                const nextLine = line ? `${line} ${word}` : word;
                if (ctx.measureText(nextLine).width > maxWidth && line) {
                    ctx.fillText(line, x, lineY);
                    line = word;
                    lineY += lineHeight;
                } else {
                    line = nextLine;
                }
            });
            if (line) ctx.fillText(line, x, lineY);
            return lineY;
        }

        function drawSpeakerIcon(ctx, x, y) {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;
            ctx.beginPath();
            ctx.arc(x, y, 39, 0, Math.PI * 2);
            ctx.fillStyle = '#173c2c';
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.strokeStyle = '#ffd56a';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 20, y - 11);
            ctx.lineTo(x - 10, y - 11);
            ctx.lineTo(x + 3, y - 22);
            ctx.lineTo(x + 3, y + 22);
            ctx.lineTo(x - 10, y + 11);
            ctx.lineTo(x - 20, y + 11);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x - 2, y, 20, -Math.PI / 3, Math.PI / 3);
            ctx.moveTo(x + 5, y - 29);
            ctx.arc(x - 2, y, 32, -Math.PI / 3, Math.PI / 3);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();
        }

        function drawMenuPage(ctx, pageKey, images) {
            const sections = MENU_SECTIONS[pageKey];
            const audioAreas = [];
            ctx.fillStyle = '#faf5eb';
            ctx.fillRect(0, 0, 1024, 1440);
            ctx.strokeStyle = '#e4d7bf';
            ctx.lineWidth = 3;
            ctx.strokeRect(26, 26, 972, 1388);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#315f49';
            ctx.font = 'bold 34px "Baloo 2", sans-serif';
            ctx.fillText('YUMMY ENGLISH  •  FOOD & DRINKS', 512, 91);
            ctx.strokeStyle = '#d7c8aa';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(72, 125);
            ctx.lineTo(952, 125);
            ctx.stroke();

            const contentTop = 158;
            const contentHeight = 1200;
            const sectionGap = 20;
            const sectionHeight = (contentHeight - sectionGap * (sections.length - 1)) / sections.length;

            sections.forEach((section, sectionIndex) => {
                const sectionTop = contentTop + sectionIndex * (sectionHeight + sectionGap);
                ctx.fillStyle = section.color;
                ctx.fillRect(58, sectionTop, 908, 58);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 34px "Baloo 2", sans-serif';
                ctx.fillText(section.title, 512, sectionTop + 40);

                const columns = 3;
                const rows = Math.ceil(section.items.length / columns);
                const cardGap = 14;
                const cardWidth = (908 - cardGap * (columns - 1)) / columns;
                const cardTop = sectionTop + 72;
                const cardAreaHeight = sectionHeight - 82;
                const cardHeight = (cardAreaHeight - cardGap * (rows - 1)) / rows;

                section.items.forEach((item, itemIndex) => {
                    const row = Math.floor(itemIndex / columns);
                    const column = itemIndex % columns;
                    const x = 58 + column * (cardWidth + cardGap);
                    const y = cardTop + row * (cardHeight + cardGap);
                    const cardImage = images[item.name];
                    const imageSize = Math.min(205, cardWidth - 38, cardHeight * 0.48);
                    const imageX = x + (cardWidth - imageSize) / 2;
                    const imageY = y + 18;

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, y, cardWidth, cardHeight);
                    ctx.strokeStyle = '#eadfcd';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, cardWidth, cardHeight);
                    ctx.fillStyle = '#f3eee5';
                    ctx.fillRect(imageX, imageY, imageSize, imageSize);
                    if (cardImage && cardImage.complete && cardImage.naturalWidth) {
                        ctx.drawImage(cardImage, imageX, imageY, imageSize, imageSize);
                    }

                    ctx.fillStyle = '#292929';
                    ctx.font = 'bold 36px "Baloo 2", sans-serif';
                    const nameLastLineY = drawWrappedText(
                        ctx,
                        item.name,
                        x + cardWidth / 2,
                        imageY + imageSize + 48,
                        cardWidth - 24,
                        40
                    );
                    ctx.fillStyle = '#77716a';
                    ctx.font = '30px "Baloo 2", sans-serif';
                    const translationY = nameLastLineY + 46;
                    ctx.fillText(`(${item.translation})`, x + cardWidth / 2, translationY);

                    const speakerX = x + cardWidth / 2;
                    const speakerY = translationY + 76;
                    drawSpeakerIcon(ctx, speakerX, speakerY);
                    audioAreas.push({ x: speakerX, y: speakerY, radius: 48, text: item.name });
                });
            });

            ctx.textAlign = 'right';
            ctx.fillStyle = '#857c70';
            ctx.font = '24px "Baloo 2", sans-serif';
            ctx.fillText(pageKey.replace('page', 'PAGE '), 950, 1390);
            PAGE_AUDIO_AREAS[pageKey] = audioAreas;
        }

        function createMenuPageTexture(pageKey) {

        function orientBookFaceUvs(geometry, width, height) {
            const positions = geometry.attributes.position;
            const uvs = geometry.attributes.uv;
            const index = geometry.index;

            geometry.groups
                .filter((group) => group.materialIndex === 2 || group.materialIndex === 3)
                .forEach((group) => {
                    for (let offset = group.start; offset < group.start + group.count; offset++) {
                        const vertexIndex = index ? index.getX(offset) : offset;
                        const x = positions.getX(vertexIndex);
                        const z = positions.getZ(vertexIndex);
                        const u = x / width;
                        uvs.setXY(
                            vertexIndex,
                            group.materialIndex === 2 ? u : 1 - u,
                            (height / 2 - z) / height
                        );
                    }
                });

            uvs.needsUpdate = true;
        }

        function roundBookCorners(geometry, width, height, radius) {
            const positions = geometry.attributes.position;
            const cornerX = width - radius;
            const cornerZ = height / 2 - radius;

            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const z = positions.getZ(i);
                if (x <= cornerX || Math.abs(z) <= cornerZ) continue;

                const centerZ = Math.sign(z) * cornerZ;
                const dx = x - cornerX;
                const dz = z - centerZ;
                const distance = Math.hypot(dx, dz);
                if (distance <= radius) continue;

                positions.setX(i, cornerX + (dx / distance) * radius);
                positions.setZ(i, centerZ + (dz / distance) * radius);
            }

            positions.needsUpdate = true;
            geometry.computeVertexNormals();
        }

        /**
         * Membuat geometri halaman kertas dengan segmentasi horizontal untuk lengkungan mulus
         */
        function createCurvedPageGeometry(width, height, depth, widthSegments = 32) {
            const geom = new THREE.BoxGeometry(width, depth, height, widthSegments, 1, widthSegments);
            geom.translate(width / 2, 0, 0);
            roundBookCorners(geom, width, height, 0.18);

            const posAttr = geom.attributes.position;
            const basePositions = new Float32Array(posAttr.array.length);
            basePositions.set(posAttr.array);
            geom.userData.basePositions = basePositions;

            return geom;
        }

        /**
         * Memperbarui lengkungan mesh kertas berdasarkan progres sudut lipatan
         */
        function updatePageBend(mesh, currentAngle) {
            const geom = mesh.geometry;
            const base = geom.userData.basePositions;
            if (!base) return;

            const posAttr = geom.attributes.position;
            const arr = posAttr.array;
            const width = BOOK_DIM.pageWidth;
            const bendFactor = Math.sin(currentAngle) * 0.42;

            for (let i = 0; i < arr.length; i += 3) {
                const bx = base[i];
                const by = base[i + 1];
                const bz = base[i + 2];

                const u = Math.max(0, Math.min(1, bx / width));
                const arch = Math.sin(u * Math.PI) * bendFactor;

                arr[i] = bx;
                arr[i + 1] = by + arch;
                arr[i + 2] = bz;
            }

            posAttr.needsUpdate = true;
            geom.computeVertexNormals();
        }

        /**
         * Inisialisasi adegan 3D Three.js, pencahayaan, meja, dan buku

        function initThreeScene() {

            const container = document.getElementById('canvas-container');

            const height = stage.clientHeight || 720;

            camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
            camera.position.set(0, FRONT_CAMERA.y, FRONT_CAMERA.z);
            camera.lookAt(0, 0.05, 0.05);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.95;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xfff1dc, 0.58);
            scene.add(ambientLight);

            const mainSpot = new THREE.DirectionalLight(0xfff4e0, 0.95);
            mainSpot.position.set(3.5, 9.5, 5.5);
            mainSpot.castShadow = true;
            mainSpot.shadow.mapSize.width = 2048;
            mainSpot.shadow.mapSize.height = 2048;
            mainSpot.shadow.camera.near = 2;
            mainSpot.shadow.camera.far = 22;
            const d = 6.5;
            mainSpot.shadow.camera.left = -d;
            mainSpot.shadow.camera.right = d;
            mainSpot.shadow.camera.top = d;
            mainSpot.shadow.camera.bottom = -d;
            mainSpot.shadow.bias = -0.0005;
            scene.add(mainSpot);

            const rimLight = new THREE.PointLight(0xffcf75, 0.35, 18);
            rimLight.position.set(-5.5, 2.0, -3.5);
            scene.add(rimLight);

            bookGroup = new THREE.Group();
            scene.add(bookGroup);

            const spineGeo = new THREE.BoxGeometry(0.16, 0.24, BOOK_DIM.coverHeight);
            const spineMat = new THREE.MeshStandardMaterial({
                color: 0x2b170f,
                roughness: 0.55,
                metalness: 0.2
            });
            spineMesh = new THREE.Mesh(spineGeo, spineMat);
            spineMesh.position.set(-0.04, 0.05, 0);
            spineMesh.castShadow = true;
            spineMesh.receiveShadow = true;
            bookGroup.add(spineMesh);

            const texFrontCover = createCoverTexture(true);
            const texBackCover = createCoverTexture(false);
            const texInsideFront = createInsideCoverTexture(true);
            const texPage1 = createMenuPageTexture('page1');
            const texPage2 = createMenuPageTexture('page2');
            const texPage3 = createMenuPageTexture('page3');
            const texPage4 = createMenuPageTexture('page4');
            const texInsideBack = createInsideCoverTexture(false);

            const goldEdgeMat = new THREE.MeshStandardMaterial({ color: 0xb59138, roughness: 0.4, metalness: 0.5 });
            const paperEdgeMat = new THREE.MeshStandardMaterial({ color: 0xe8dec8, roughness: 0.85 });
            const leatherEdgeMat = new THREE.MeshStandardMaterial({ color: 0x2b170f, roughness: 0.6 });

            const sheetSpecs = [
                {
                    isCover: true,
                    topTex: texFrontCover,
                    bottomTex: texInsideFront,
                    edgeMat: goldEdgeMat
                },
                {
                    isCover: false,
                    topTex: texPage1,
                    bottomTex: texPage2,
                    edgeMat: paperEdgeMat
                },
                {
                    isCover: false,
                    topTex: texPage3,
                    bottomTex: texPage4,
                    edgeMat: paperEdgeMat
                },
                {
                    isCover: true,
                    topTex: texInsideBack,
                    bottomTex: texBackCover,
                    edgeMat: leatherEdgeMat
                }
            ];

            sheetSpecs.forEach((spec, index) => {
                const pivot = new THREE.Group();
                pivot.position.set(0, (AppState.totalSheets - 1 - index) * BOOK_DIM.stackGap, 0);
                bookGroup.add(pivot);

                const w = spec.isCover ? BOOK_DIM.coverWidth : BOOK_DIM.pageWidth;
                const h = spec.isCover ? BOOK_DIM.coverHeight : BOOK_DIM.pageHeight;
                const d = spec.isCover ? BOOK_DIM.coverThickness : BOOK_DIM.pageThickness;

                const geometry = spec.isCover
                    ? new THREE.BoxGeometry(w, d, h, 32, 1, 32)
                    : createCurvedPageGeometry(w, h, d, 32);

                if (spec.isCover) {
                    geometry.translate(w / 2, 0, 0);
                    roundBookCorners(geometry, w, h, 0.24);
                }
                orientBookFaceUvs(geometry, w, h);

                const topMat = spec.isCover
                    ? new THREE.MeshStandardMaterial({
                        map: spec.topTex,
                        roughness: 0.52,
                        metalness: 0.12
                    })
                    : new THREE.MeshBasicMaterial({ map: spec.topTex, toneMapped: false });
                const bottomMat = spec.isCover
                    ? new THREE.MeshStandardMaterial({
                        map: spec.bottomTex,
                        roughness: 0.65,
                        metalness: 0.02
                    })
                    : new THREE.MeshBasicMaterial({ map: spec.bottomTex, toneMapped: false });

                const materials = [
                    spec.edgeMat,
                    spec.edgeMat,
                    topMat,
                    bottomMat,
                    spec.edgeMat,
                    spec.edgeMat
                ];

                const mesh = new THREE.Mesh(geometry, materials);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                pivot.add(mesh);

                sheets.push({
                    index,
                    pivot,
                    mesh,
                    isCover: spec.isCover,
                    currentAngle: 0,
                    targetAngle: 0
                });
            });

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
        }

        /**
         * Berpindah ke posisi lembaran tertentu (0 sampai 4)
         */
        function goToSheet(targetIndex) {
            const clamped = Math.max(0, Math.min(AppState.totalSheets, targetIndex));
            if (clamped === AppState.currentSheet) return;

            AppState.currentSheet = clamped;
            playPageFlipSound();
            sheets.forEach((sheet, idx) => {
                sheet.targetAngle = idx < clamped ? Math.PI : 0;
            });
        }

        function playPageFlipSound() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                console.error('Browser ini tidak mendukung audio efek balik halaman.');
                return;
            }

            if (!flipAudioContext) {
                flipAudioContext = new AudioContextClass();
                const sampleRate = flipAudioContext.sampleRate;
                flipNoiseBuffer = flipAudioContext.createBuffer(1, Math.floor(sampleRate * 0.28), sampleRate);
                const noise = flipNoiseBuffer.getChannelData(0);
                for (let i = 0; i < noise.length; i++) {
                    noise[i] = (Math.random() * 2 - 1) * (1 - i / noise.length);
                }
            }

            const now = flipAudioContext.currentTime;
            const source = flipAudioContext.createBufferSource();
            const filter = flipAudioContext.createBiquadFilter();
            const volume = flipAudioContext.createGain();
            source.buffer = flipNoiseBuffer;
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2200, now);
            filter.frequency.exponentialRampToValueAtTime(700, now + 0.28);
            volume.gain.setValueAtTime(0.001, now);
            volume.gain.exponentialRampToValueAtTime(0.06, now + 0.035);
            volume.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            source.connect(filter);
            filter.connect(volume);
            volume.connect(flipAudioContext.destination);
            source.start(now);
            flipAudioContext.resume().catch((error) => {
                console.error('Gagal mengaktifkan audio efek balik halaman:', error);
            });
        }

        /**
         * Menyesuaikan ukuran kanvas agar selalu mengikuti kontainer 16:9
         */
        function handleResponsiveCamera() {
            if (!camera || !renderer) return;
            const stage = document.getElementById('stage-16-9');
            const width = stage.clientWidth;
            const height = stage.clientHeight;
            if (!width || !height) return;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        /**
         * Event Listener untuk membalik halaman buku (Klik, Sentuh/Geser, & Keyboard)
         */
        function setupEventListeners() {
            const domElem = renderer.domElement;
            let touchStartX = 0;

            domElem.addEventListener('click', (e) => {
                handleBookClick(e.clientX, e.clientY);
            });

            domElem.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                }
            }, { passive: true });

            domElem.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) {
                    const touchEndX = e.changedTouches[0].clientX;
                    const deltaX = touchEndX - touchStartX;
                    if (Math.abs(deltaX) > 35) {
                        if (deltaX < 0) {
                            goToSheet(AppState.currentSheet + 1);
                        } else {
                            goToSheet(AppState.currentSheet - 1);
                        }
                    }
                }
            }, { passive: true });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    goToSheet(AppState.currentSheet + 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToSheet(AppState.currentSheet - 1);
                } else if (e.key === 'Home' || e.key === 'Escape') {
                    goToSheet(0);
                }
            });

            window.addEventListener('resize', handleResponsiveCamera);
        }

        function speakMenuItem(text) {
            if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
                console.error('Browser ini tidak mendukung audio pengucapan.');
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        /**
         * Raycasting: mendeteksi ikon audio atau sisi kanan/kiri buku
         */
        function handleBookClick(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = sheets.map((s) => s.mesh);
            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const sheet = sheets.find((item) => item.mesh === hit.object);
                if (sheet && !sheet.isCover && hit.uv &&
                    (hit.face.materialIndex === 2 || hit.face.materialIndex === 3)) {
                    const pageKey = sheet.index === 1
                        ? (hit.face.materialIndex === 2 ? 'page1' : 'page2')
                        : (hit.face.materialIndex === 2 ? 'page3' : 'page4');
                    const canvasX = hit.uv.x * 1024;
                    const canvasY = (1 - hit.uv.y) * 1440;
                    const audioArea = (PAGE_AUDIO_AREAS[pageKey] || []).find((area) => {
                        return Math.hypot(canvasX - area.x, canvasY - area.y) <= area.radius;
                    });
                    if (audioArea) {
                        speakMenuItem(audioArea.text);
                        return;
                    }
                }

                const hitPoint = hit.point;
                if (hitPoint.x >= bookGroup.position.x) {
                    goToSheet(AppState.currentSheet + 1);
                } else {
                    goToSheet(AppState.currentSheet - 1);
                }
            }
        }

        /**
         * Loop Animasi Utama
         */
        function animate() {
            requestAnimationFrame(animate);

            const flipSpeed = 0.11;
            sheets.forEach((sheet, idx) => {
                const diff = sheet.targetAngle - sheet.currentAngle;
                if (Math.abs(diff) > 0.0005) {
                    sheet.currentAngle += diff * flipSpeed;
                } else {
                    sheet.currentAngle = sheet.targetAngle;
                }

                sheet.pivot.rotation.z = sheet.currentAngle;

                const progress = sheet.currentAngle / Math.PI;
                const yRight = (AppState.totalSheets - 1 - idx) * BOOK_DIM.stackGap;
                const yLeft = idx * BOOK_DIM.stackGap;
                const arcLift = Math.sin(progress * Math.PI) * 0.14;
                sheet.pivot.position.y = yRight * (1 - progress) + yLeft * progress + arcLift;

                if (!sheet.isCover) {
                    updatePageBend(sheet.mesh, sheet.currentAngle);
                }
            });

            let targetBookX = 0;
            if (AppState.currentSheet === 0) {
                targetBookX = -BOOK_DIM.pageWidth * 0.46;
            } else if (AppState.currentSheet === AppState.totalSheets) {
                targetBookX = BOOK_DIM.pageWidth * 0.46;
            }
            bookGroup.position.x += (targetBookX - bookGroup.position.x) * 0.09;

            camera.position.set(0, FRONT_CAMERA.y, FRONT_CAMERA.z);
            camera.lookAt(0, 0.05, 0.05);

            renderer.render(scene, camera);
        }

        /**
         * Memulai aplikasi setelah DOM siap
         */
        async function startApp() {
            if (window.__bookInitialized) return;
            window.__bookInitialized = true;
            try {
                await Promise.all([
                    document.fonts.load('400 16px "Baloo 2"'),
                    document.fonts.load('700 16px "Baloo 2"')
                ]).catch((error) => {
                    console.error('Gagal memuat font buku:', error);
                });
                initThreeScene();
                setupEventListeners();
                handleResponsiveCamera();
                animate();
            } catch (error) {
                console.error('Terjadi kesalahan saat memuat Buku 3D:', error);
            }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            startApp();
        } else {
            window.addEventListener('DOMContentLoaded', startApp);
            window.addEventListener('load', startApp);
        }
    </script>
    <script src="../js/app.js"></script>
</body>
</html>
