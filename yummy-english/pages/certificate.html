<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat Yummy English</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="certificate">
    <main id="game-container" class="certificate-page">
        <header class="certificate-toolbar">
            <a class="certificate-back" href="menu.html">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                Kembali ke menu
            </a>
            <label class="certificate-name-field" for="certificate-name">
                <span>Nama siswa</span>
                <input id="certificate-name" name="name" type="text" maxlength="36" autocomplete="name" placeholder="Ketik nama siswa">
            </label>
            <button class="certificate-print" type="button" onclick="window.print()">
                <i class="fas fa-download" aria-hidden="true"></i>
                Cetak / Simpan PDF
            </button>
        </header>
        <section class="certificate-stage" aria-label="Pratinjau sertifikat">
            <div class="certificate-canvas">
                <img src="../assets/images/certificate.png" alt="Template sertifikat Yummy English: Food and Drinks">
                <span id="certificate-student-name" class="certificate-student-name">Nama Siswa</span>
                <span id="certificate-final-score" class="certificate-final-score">0</span>
                <span id="certificate-date" class="certificate-date"></span>
            </div>
        </section>
    </main>
    <script src="../js/app.js"></script>
</body>
</html>
