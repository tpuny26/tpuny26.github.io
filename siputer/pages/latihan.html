<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan Komponen Komputer</title>
  <style>
    :root {
      --ink: #183153;
      --muted: #617895;
      --paper: #f2faff;
      --line: rgba(196, 226, 242, .98);
      --green: #24b99b;
      --sky: #52bde8;
      --violet: #9c87f5;
    }

    * { box-sizing: border-box; }

    html, body {
      background: url("../asset/BG-all.png") center center / cover no-repeat fixed;
    }

    body {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(100vw, 177.7778dvh);
      height: min(100dvh, 56.25vw);
      transform: translate(-50%, -50%);
      aspect-ratio: 16 / 9;
      margin: 0;
      overflow: auto;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: flex;
      width: min(760px, calc(100% - 32px));
      min-height: 100dvh;
      flex-direction: column;
      justify-content: center;
      margin: 0 auto;
      padding: 18px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .topbar a {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      padding: 9px 14px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(66, 131, 175, .12);
      transition: border-color .15s ease, transform .15s ease;
    }

    .topbar a:hover { border-color: var(--sky); transform: translateY(-1px); }
    .topbar a:focus-visible,
    .answer:focus-visible,
    #next:focus-visible {
      outline: 3px solid #245fda;
      outline-offset: 3px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: -.035em;
      background: linear-gradient(100deg, #43b9e8, #8b7bea 58%, #40c6a9);
      background-clip: text;
      color: transparent;
    }

    .card {
      border: 1.5px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      padding: clamp(20px, 5vw, 36px);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(66, 131, 175, .14);
    }

    .progress {
      height: 8px;
      margin-bottom: 26px;
      border-radius: 999px;
      background: #e7f2fa;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 20%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--sky), var(--violet));
      transition: width .2s ease;
    }

    #number {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    #question {
      margin: 0 0 22px;
      font-size: clamp(18px, 4vw, 24px);
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .9);
      padding: 13px 16px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(66, 131, 175, .08);
      transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
    }

    .answer:hover:not(:disabled) {
      border-color: var(--sky);
      background: #f0fbff;
      box-shadow: 0 10px 22px rgba(66, 131, 175, .14);
      transform: translateY(-1px);
    }
    .answer.correct { border-color: #4aaf90; background: #edf9f5; }
    .answer.wrong { border-color: #df8375; background: #fff3f0; }
    .answer:disabled { cursor: default; }

    #next {
      display: none;
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(100deg, var(--green), var(--sky));
      padding: 14px 18px;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(66, 166, 177, .24);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    #next:hover,
    #restart:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(66, 166, 177, .3);
    }

    #result { display: none; text-align: center; }
    #quiz { display: none; }
    #result strong { display: block; font-size: 52px; color: var(--green); }
    #name-screen { text-align: center; }
    #name-screen h2 { margin: 0 0 8px; }
    #name-screen p { margin: 0 0 18px; color: var(--muted); }
    #name-form { display: flex; gap: 10px; }
    #student-name {
      flex: 1;
      min-width: 0;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: white;
      padding: 13px 15px;
      color: var(--ink);
      font: inherit;
    }
    #student-name:focus { outline: 3px solid rgba(82, 189, 232, .25); border-color: var(--sky); }
    #start {
      border: 0;
      border-radius: 14px;
      background: linear-gradient(100deg, var(--green), var(--sky));
      padding: 13px 18px;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    #feedback {
      display: none;
      margin-top: 14px;
      border-radius: 12px;
      padding: 11px 13px;
      font-weight: 750;
    }
    #feedback.correct-feedback { background: #edf9f5; color: #24866c; }
    #feedback.wrong-feedback { background: #fff3f0; color: #b95d50; }
    #result-name { margin: 4px 0 14px; color: var(--muted); }
    .answer-overview {
      width: 100%;
      margin: 18px 0;
      border-collapse: collapse;
      text-align: left;
    }
    .answer-overview th,
    .answer-overview td {
      border-bottom: 1px solid var(--line);
      padding: 9px 7px;
      font-size: 13px;
    }
    .answer-overview th { color: var(--muted); }
    .answer-overview .status-correct { color: #24866c; font-weight: 800; }
    .answer-overview .status-wrong { color: #b95d50; font-weight: 800; }

    .orientation-gate { display: none; }

    @media (max-width: 760px) and (orientation: landscape) {
      .shell {
        width: min(100% - 20px, 620px);
        padding: 10px 0;
      }

      .topbar { margin-bottom: 10px; }
      .topbar a { padding: 7px 11px; font-size: 12px; }
      h1 { font-size: 22px; }
      .card { padding: 14px; border-radius: 18px; }
      .progress { height: 6px; margin-bottom: 12px; }
      #number { margin-bottom: 5px; font-size: 11px; }
      #question { margin-bottom: 12px; font-size: 18px; }
      .answers { gap: 7px; }
      .answer { padding: 9px 12px; border-radius: 11px; font-size: 13px; }
      #next { margin-top: 10px; padding: 10px 14px; }
      #result strong { font-size: 40px; }
      #name-form { gap: 7px; }
      #student-name, #start { padding: 9px 12px; }
      #feedback { margin-top: 8px; padding: 8px 10px; }
      .answer-overview th, .answer-overview td { padding: 5px 4px; font-size: 11px; }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      .orientation-gate {
        position: fixed;
        z-index: 99999;
        top: calc((100% - 100dvh) / 2);
        left: calc((100% - 100vw) / 2);
        width: 100vw;
        height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: linear-gradient(rgba(234,248,255,.84), rgba(240,237,255,.84)), url("../asset/BG-all.png") center / cover no-repeat;
        color: #183153;
        font: 700 20px/1.6 Inter, sans-serif;
        text-align: center;
      }
    }
  </style>
  <script src="../click-sound.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <h1>Latihan</h1>
      <a href="../index.html">← Menu utama</a>
    </div>

    <section class="card" aria-live="polite">
      <div id="name-screen">
        <h2>Siapa nama kamu?</h2>
        <p>Masukkan nama sebelum memulai latihan.</p>
        <form id="name-form">
          <input id="student-name" type="text" maxlength="40" autocomplete="name" placeholder="Nama lengkap" required>
          <button id="start" type="submit">Mulai</button>
        </form>
      </div>
      <div id="quiz">
        <div class="progress"><span id="progress"></span></div>
        <p id="number"></p>
        <h2 id="question"></h2>
        <div class="answers" id="answers"></div>
        <div id="feedback"></div>
        <button id="next" type="button">Soal berikutnya</button>
      </div>
      <div id="result">
        <strong id="score"></strong>
        <h2>Latihan selesai</h2>
        <p id="result-name"></p>
        <table class="answer-overview">
          <thead>
            <tr><th>No.</th><th>Jawabanmu</th><th>Jawaban benar</th><th>Status</th></tr>
          </thead>
          <tbody id="answer-overview"></tbody>
        </table>
        <button id="restart" class="answer" type="button" style="text-align:center">Ulangi latihan</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        text: "Saat membuka banyak aplikasi untuk mengerjakan tugas, laptop terasa lambat meski penyimpanan masih kosong. Komponen apa yang paling mungkin perlu ditambah?",
        choices: ["RAM", "PSU", "Monitor", "Speaker"],
        answer: 0,
        explanation: "RAM membantu komputer menyimpan data aplikasi yang sedang aktif, sehingga multitasking lebih lancar."
      },
      {
        text: "Kamu ingin membawa foto dan tugas ke komputer lain menggunakan penyimpanan portabel yang bisa langsung dicolokkan. Perangkat mana yang paling tepat digunakan?",
        choices: ["SSD eksternal", "Adaptor Wi-Fi", "Catu daya", "Kartu grafis"],
        answer: 0,
        explanation: "SSD eksternal bisa menyimpan dan memindahkan data dengan cepat. Adaptor Wi-Fi digunakan untuk akses internet nirkabel."
      },
      {
        text: "Komputer sering lag saat bermain game dan menonton video resolusi tinggi. Komponen mana yang sebaiknya ditingkatkan?",
        choices: ["HDD", "Kartu grafis", "NIC", "CD-ROM"],
        answer: 1,
        explanation: "Kartu grafis memproses tampilan game, gambar, dan video agar berjalan lebih lancar."
      },
      {
        text: "Saat menyimpan tugas sekolah, kamu ingin data tetap aman meski komputer mati dan tidak perlu dibuka segera. Komponen mana yang menyimpan data jangka panjang?",
        choices: ["RAM", "CPU", "SSD atau HDD", "PSU"],
        answer: 2,
        explanation: "SSD atau HDD menyimpan data secara permanen meskipun komputer dimatikan."
      },
      {
        text: "Komputer baru sudah dirakit, tetapi lampu dan kipas tidak menyala sama sekali. Komponen mana yang perlu diperiksa lebih dahulu?",
        choices: ["Catu daya", "Monitor", "Memori", "Kartu Wi-Fi"],
        answer: 0,
        explanation: "Catu daya menyalurkan listrik ke seluruh komponen, jadi perlu diperiksa jika komponen sama sekali tidak menyala."
      }
    ];

    let index = 0;
    let score = 0;
    let studentName = "";
    const answerRecords = [];
    const nameScreen = document.querySelector("#name-screen");
    const nameForm = document.querySelector("#name-form");
    const studentNameInput = document.querySelector("#student-name");
    const quiz = document.querySelector("#quiz");
    const result = document.querySelector("#result");
    const number = document.querySelector("#number");
    const question = document.querySelector("#question");
    const answers = document.querySelector("#answers");
    const progress = document.querySelector("#progress");
    const next = document.querySelector("#next");
    const feedback = document.querySelector("#feedback");

    function playTringSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const context = new AudioContext();
      const start = context.currentTime;
      [880, 1320].forEach((frequency, part) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const toneStart = start + part * 0.09;
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, toneStart);
        gain.gain.setValueAtTime(0.0001, toneStart);
        gain.gain.exponentialRampToValueAtTime(0.08, toneStart + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, toneStart + 0.28);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(toneStart);
        oscillator.stop(toneStart + 0.28);
      });
    }

    nameForm.addEventListener("submit", (event) => {
      event.preventDefault();
      studentName = studentNameInput.value.trim();
      if (!studentName) return;
      nameScreen.style.display = "none";
      quiz.style.display = "block";
      showQuestion();
    });

    function showQuestion() {
      const item = questions[index];
      number.textContent = `Soal ${index + 1} dari ${questions.length}`;
      question.textContent = item.text;
      progress.style.width = `${((index + 1) / questions.length) * 100}%`;
      answers.replaceChildren();
      next.style.display = "none";
      feedback.style.display = "none";
      feedback.className = "";

      item.choices.forEach((choice, choiceIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.textContent = choice;
        button.dataset.answer = String(choiceIndex);
        button.addEventListener("click", () => choose(button, choiceIndex));
        answers.appendChild(button);
      });
    }

    function choose(selected, choiceValue) {
      const item = questions[index];
      const isCorrect = choiceValue === item.answer;
      [...answers.children].forEach((button) => {
        button.disabled = true;
        if (Number(button.dataset.answer) === item.answer) button.classList.add("correct");
      });

      if (isCorrect) {
        score++;
        selected.classList.add("correct");
      } else {
        selected.classList.add("wrong");
      }

      answerRecords[index] = {
        selected: item.choices[choiceValue],
        correct: item.choices[item.answer],
        isCorrect
      };
      feedback.textContent = `${isCorrect ? "Benar!" : "Belum tepat."} ${item.explanation}`;
      feedback.className = isCorrect ? "correct-feedback" : "wrong-feedback";
      feedback.style.display = "block";
      playTringSound();
      next.style.display = "block";
      next.textContent = index === questions.length - 1 ? "Lihat hasil" : "Soal berikutnya";
    }

    next.addEventListener("click", () => {
      index++;
      if (index < questions.length) {
        showQuestion();
      } else {
        quiz.style.display = "none";
        result.style.display = "block";
        document.querySelector("#score").textContent = `${score}/${questions.length}`;
        document.querySelector("#result-name").textContent = `Nama peserta: ${studentName}`;
        document.querySelector("#answer-overview").innerHTML = answerRecords.map((record, recordIndex) => `
          <tr>
            <td>${recordIndex + 1}</td>
            <td>${record.selected}</td>
            <td>${record.correct}</td>
            <td class="${record.isCorrect ? "status-correct" : "status-wrong"}">${record.isCorrect ? "Benar" : "Salah"}</td>
          </tr>
        `).join("");
      }
    });

    document.querySelector("#restart").addEventListener("click", () => {
      index = 0;
      score = 0;
      answerRecords.length = 0;
      result.style.display = "none";
      quiz.style.display = "block";
      showQuestion();
    });
  </script>
  <div class="orientation-gate" role="status" aria-live="polite">
    <p>Putar perangkat Anda ke posisi horizontal untuk melanjutkan.</p>
  </div>
</body>
</html>
