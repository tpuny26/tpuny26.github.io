<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Komponen Komputer 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      --ink: #183153;
      --muted: #617895;
      --accent: #ff8e72;
      --paper: #f2faff;
      --card: #ffffff;
      --line: #cfe7f3;
    }

    * { box-sizing: border-box; }

    html, body {
      background: url("../asset/BG-all.png") center center / cover no-repeat fixed;
    }

    body {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(100vw, 177.7778dvh);
      height: min(100dvh, 56.25vw);
      transform: translate(-50%, -50%);
      aspect-ratio: 16 / 9;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      margin: 0;
      padding: 18px 24px;
      overflow: auto;
      background: rgba(255,255,255,.08);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 24px rgba(23, 32, 51, .08);
      font-size: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      letter-spacing: -.04em;
    }

    .eyebrow {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .count {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      padding: 8px 14px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(66, 131, 175, .12);
      transition: border-color .15s ease, transform .15s ease;
      white-space: nowrap;
    }

    .menu-button:hover {
      transform: translateY(-1px);
      border-color: #70cbe8;
    }

    .menu-button:focus-visible {
      outline: 3px solid #245fda;
      outline-offset: 3px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      flex: 1;
      min-height: 0;
      gap: 18px;
    }

    .viewer-card,
    .asset-panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 48px rgba(23, 32, 51, .08);
    }

    .viewer-card {
      min-height: 0;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background:
        radial-gradient(circle at 50% 42%, rgba(130, 212, 248, .36), transparent 35%),
        linear-gradient(145deg, #faffff, #e6f4ff 55%, #f0eaff);
    }

    .viewer-meta {
      position: absolute;
      z-index: 2;
      left: 18px;
      bottom: 18px;
      max-width: min(520px, calc(100% - 36px));
      padding: 12px 16px;
      border: 1px solid rgba(229, 233, 242, .9);
      border-radius: 14px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .viewer-card { position: relative; }

    .viewer-meta strong,
    .viewer-meta span { display: block; }

    .viewer-meta strong {
      margin-bottom: 2px;
      font-size: 15px;
    }

    .viewer-meta span {
      color: var(--muted);
      font-size: 12px;
    }

    .viewer-meta p {
      margin: 5px 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .asset-panel {
      height: 100%;
      padding: 12px;
      overflow-y: auto;
    }

    .asset-list {
      display: grid;
      gap: 8px;
    }

    .asset-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      padding: 9px;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .asset-button:hover {
      border-color: var(--line);
      background: #f0f9ff;
    }

    .asset-button.active {
      border-color: rgba(255, 142, 114, .48);
      background: linear-gradient(100deg, #fff1eb, #fff8f2);
    }

    .asset-index {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border-radius: 10px;
      background: #e9f2fb;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .asset-button.active .asset-index {
      background: var(--accent);
      color: white;
    }

    .asset-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
    }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
      .viewer-card, model-viewer { min-height: 520px; height: 520px; }
      .asset-panel { height: auto; max-height: none; }
      .asset-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 540px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 16px; }
      header { align-items: flex-start; }
      .count { display: none; }
      .viewer-card, model-viewer { min-height: 430px; height: 430px; }
      .asset-list { grid-template-columns: 1fr; }
      .viewer-meta { left: 12px; bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .shell { padding: 10px 14px; }
      header { margin-bottom: 8px; }
      .brand-mark { width: 36px; height: 36px; }
      .workspace { grid-template-columns: minmax(0, 1fr) 230px; gap: 10px; }
      .viewer-card, model-viewer { min-height: 0; height: 100%; }
      .asset-panel { height: 100%; }
      .asset-list { grid-template-columns: 1fr; }
    }

    .orientation-gate { display: none; }

    @media (orientation: portrait) and (max-width: 900px) {
      .orientation-gate {
        position: fixed;
        z-index: 99999;
        top: calc((100% - 100dvh) / 2);
        left: calc((100% - 100vw) / 2);
        width: 100vw;
        height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: linear-gradient(rgba(234,248,255,.84), rgba(240,237,255,.84)), url("../asset/BG-all.png") center / cover no-repeat;
        color: #183153;
        font: 700 20px/1.6 Inter, sans-serif;
        text-align: center;
      }
    }
  </style>
  <script src="../click-sound.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">3D</div>
        <div>
          <h1>Komponen Komputer</h1>
          <p class="eyebrow">Galeri aset 3D interaktif</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="count">8 aset tersedia</div>
        <a class="menu-button" href="../index.html">← Menu</a>
      </div>
    </header>

    <section class="workspace" aria-label="Galeri komponen komputer">
      <div class="viewer-card">
        <model-viewer
          id="viewer"
          src="../asset/core_i7_processor.glb"
          alt="Prosesor"
          camera-controls
          touch-action="pan-y"
          interaction-prompt="auto"
          shadow-intensity=".7"
          exposure="1"
          environment-image="neutral"
          ar
        >
          <div slot="poster" class="viewer-meta">
            <strong>Memuat model...</strong>
          </div>
        </model-viewer>
        <div class="viewer-meta" aria-live="polite">
          <strong id="assetTitle">Prosesor</strong>
          <p id="assetDescription">Mengolah instruksi dan mengatur kerja komponen komputer.</p>
          <span>Geser untuk memutar · Cubit untuk memperbesar</span>
        </div>
      </div>

      <aside class="asset-panel" aria-label="Daftar aset">
        <div class="asset-list" id="assetList"></div>
      </aside>
    </section>
  </main>

  <script>
    const assets = [
      { name: "Prosesor", file: "core_i7_processor.glb", description: "Mengolah instruksi dan mengatur kerja komponen komputer." },
      { name: "Hard Disk (HDD)", file: "hdd.glb", description: "Menyimpan data jangka panjang pada piringan magnetik." },
      { name: "Solid-State Drive (SSD)", file: "m.2_nvme_ssd_samsung_990_pro_1tb_3d_model.glb", description: "Menyimpan sistem dan file dengan akses data berkecepatan tinggi." },
      { name: "Kartu Jaringan (NIC)", file: "network_interface_card.glb", description: "Menghubungkan komputer ke jaringan melalui koneksi Ethernet." },
      { name: "Kartu Grafis (GPU)", file: "nvidia_geforce_rtx_5070_-_msi_gaming_x_trio.glb", description: "Memproses grafis, gambar, dan video untuk ditampilkan ke layar." },
      { name: "Catu Daya (PSU)", file: "psu_power_supply_unit.glb", description: "Mengubah dan menyalurkan daya listrik ke komponen komputer." },
      { name: "Memori (RAM)", file: "random_access_memory.glb", description: "Menyimpan sementara data aplikasi yang sedang digunakan prosesor." },
      { name: "Wi-Fi Card", file: "wireless_adaptor.glb", description: "Menghubungkan komputer ke jaringan Wi-Fi tanpa kabel." }
    ];

    const viewer = document.querySelector("#viewer");
    const assetTitle = document.querySelector("#assetTitle");
    const assetDescription = document.querySelector("#assetDescription");
    const assetList = document.querySelector("#assetList");

    function selectAsset(asset, button) {
      document.querySelectorAll(".asset-button").forEach((item) => {
        item.classList.remove("active");
        item.setAttribute("aria-current", "false");
      });

      button.classList.add("active");
      button.setAttribute("aria-current", "true");
      assetTitle.textContent = asset.name;
      assetDescription.textContent = asset.description;
      viewer.alt = asset.name;
      viewer.src = `../asset/${asset.file}`;
      viewer.cameraTarget = "auto auto auto";
      viewer.cameraOrbit = "auto auto auto";
    }

    assets.forEach((asset, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "asset-button" + (index === 0 ? " active" : "");
      button.setAttribute("aria-current", index === 0 ? "true" : "false");
      button.innerHTML = `
        <span class="asset-index">${String(index + 1).padStart(2, "0")}</span>
        <span class="asset-name">${asset.name}</span>
      `;
      button.addEventListener("click", () => selectAsset(asset, button));
      assetList.appendChild(button);
    });
  </script>
  <div class="orientation-gate" role="status" aria-live="polite">
    <p>Putar perangkat Anda ke posisi horizontal untuk melanjutkan.</p>
  </div>
</body>
</html>
